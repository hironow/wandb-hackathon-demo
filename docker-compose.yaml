services:
  local-issues-mcp:
    build:
      context: ./apps/local-issues
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
      cache_from:
        - type=registry,ref=local-issues-mcp:latest
    ports:
      - "8834:8834"
    environment:
      # Required environment variables:
      # - MCP_PORT: HTTP server port (default: 8834)
      # - LOCAL_ISSUES_DB_PATH: SQLite database file path (default: /app/.run/local-issues.db)
      # - LOG_LEVEL: Logging verbosity (default: info)
      MCP_PORT: "8834"
      LOCAL_ISSUES_DB_PATH: /app/.run/local-issues.db
      LOG_LEVEL: info
    volumes:
      - local-issues-data:/app/.run
    read_only: true
    tmpfs:
      - /tmp:size=64M
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8834/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  local-issues-data:
    driver: local
